# CareFlow Atlas —— 纯静态托管配置。
#
# 本容器不含后端、数据库或任何业务数据：业务记录存在访问者浏览器的
# localStorage，这里只负责把构建产物发出去。详见 docs/DOCKER.md。
#
# 保持配置简单；运行验证见 deploy/verify.sh 和 docs/VALIDATION.md。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不回显 nginx 版本号
    server_tokens off;

    # 文本资源压缩。xlsx 本身已是压缩格式，列进来只会白费 CPU。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 带内容哈希的构建产物：内容变了文件名就变，可以长期强缓存。
    # 下面每个 location 都要重复上面三个安全头：nginx 的 add_header 不跨层继承，
    # 某个 location 只要自己写了 add_header，就会丢掉 server 层的全部 add_header。
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        # 这一条**故意不带 always**：带 always 的话 404 也会被标成「一年内不可变」，
        # 一旦前端取到缺失产物，浏览器/CDN 会把那个 404 钉死一年。
        # 不带 always 时 nginx 只对 2xx/3xx 加这个头，404 拿不到长缓存。
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 演示工作簿（合成资料）：随版本更新，不长期缓存。
    # 这里用 =404 兜底而不是回落 index.html —— 应用是程序化 fetch 这些文件，
    # 缺失时返回 200 的 HTML 会被当成工作簿去解析，404 才是诚实的答复。
    location /demo/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
    }

    # 其余请求（入口文档、静态资源）都不长期缓存，保证刷新能拿到新版本。
    # 页面导航路径回落到入口文档，这是单页应用的常规做法。
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
    }
}
