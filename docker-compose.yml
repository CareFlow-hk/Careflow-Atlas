# Account service + static demo workspace. Use docs/ACCOUNTS.md for initialization.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    image: ${ATLAS_WEB_IMAGE:-careflow-atlas:accounts}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
  auth:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ${ATLAS_AUTH_IMAGE:-careflow-atlas-auth:accounts}
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS origin or explicit localhost test origin}
      ALLOW_INSECURE_LOCALHOST: ${ALLOW_INSECURE_LOCALHOST:-false}
      TRUST_PROXY: "true"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://CareFlow-VPS.services.ai.azure.com/openai/v1}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-6-luna}
      AZURE_OPENAI_FALLBACK_DEPLOYMENT: ${AZURE_OPENAI_FALLBACK_DEPLOYMENT-gpt-6.1-sol}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    volumes:
      - accounts:/app/data
    restart: unless-stopped
volumes:
  accounts:
